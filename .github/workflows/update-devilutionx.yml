# NOTE: this workflow is disabled_manually on GitHub. That state is keyed to
# this file's path, so editing it here keeps it disabled — renaming the file
# would create a new workflow that starts out enabled.
name: Update DevilutionX
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
jobs:
  update-devilutionx:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false

      - name: Run the update script
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
        run: |
          set -o pipefail

          # pkgs/devilutionx/update.sh is the single source of truth. It bumps
          # `src` to the latest upstream master *and* re-syncs the vendored
          # 3rdParty pins that commit expects — bumping src alone lets the two
          # drift apart and breaks the build. It is a no-op when nothing moved.
          #
          # Invoked through `nix shell` rather than its nix-shell shebang, which
          # would need a NIX_PATH channel the runner does not have. --inputs-from
          # resolves nixpkgs from this repo's flake.lock instead of the registry,
          # so the tooling is pinned. `nix` and `nix-prefetch-url` come from the
          # Nix install itself; the script fails loudly if either is absent.
          nix shell --inputs-from . \
            nixpkgs#curl nixpkgs#jq nixpkgs#gawk nixpkgs#nix-prefetch-github \
            --command bash pkgs/devilutionx/update.sh 2>&1 \
            | tee /tmp/devilutionx-update.log

          if git diff --quiet -- pkgs/devilutionx/default.nix; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # Read back what the script pinned. sed, not awk: the runner's awk is
          # mawk, which cannot parse gawk's three-argument match().
          VERSION=$(sed -n 's/^  version = "\(.*\)";$/\1/p' pkgs/devilutionx/default.nix | head -n1)
          REV=$(sed -n '/^  src = fetchFromGitHub/,/};/ s/^    rev = "\(.*\)";$/\1/p' pkgs/devilutionx/default.nix | head -n1)
          if [ -z "$VERSION" ] || [ -z "$REV" ]; then
            echo "ERROR: could not read version/rev back from default.nix" >&2
            exit 1
          fi
          SHORT_REV=${REV:0:7}
          DATE=$(echo "$VERSION" | sed 's/^unstable-\(.*\)-[^-]*$/\1/')
          # Cosmetic only, so never let it fail the run: an absent secret sends an
          # empty Bearer header and 401s, which pipefail + bash -e would otherwise
          # turn into a discarded update.
          COMMIT_API="https://api.github.com/repos/diasurgical/devilutionX/commits/$REV"
          if [ -n "$GITHUB_TOKEN" ]; then
            RAW=$(curl -sfL -H "Authorization: Bearer $GITHUB_TOKEN" "$COMMIT_API" || true)
          else
            RAW=$(curl -sfL "$COMMIT_API" || true)
          fi
          SUBJECT=$(printf '%s' "$RAW" | jq -r '.commit.message // empty' 2>/dev/null | head -n1 || true)

          echo "short_rev=$SHORT_REV" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

          {
            printf 'Updates DevilutionX to [`%s`](https://github.com/diasurgical/devilutionX/commit/%s).\n\n' \
              "$SHORT_REV" "$REV"
            [ -n "$SUBJECT" ] && printf '> %s\n\n' "$SUBJECT"
            printf 'Produced by `pkgs/devilutionx/update.sh`, which also re-syncs the vendored\n'
            printf '3rdParty dependency pins to whatever the new commit expects. Not build-tested\n'
            printf 'by CI — run `nix build .#devilutionx` before merging.\n\n'
            printf '<details><summary>Update log</summary>\n\n```\n'
            cat /tmp/devilutionx-update.log
            printf '```\n\n</details>\n'
          } > /tmp/devilutionx-pr-body.md

      - name: Create Pull Request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
          commit-message: "chore: update devilutionx to ${{ steps.update.outputs.short_rev }}"
          branch: update-devilutionx
          title: "chore: update devilutionx to ${{ steps.update.outputs.date }}"
          body-path: /tmp/devilutionx-pr-body.md
          labels: |
            dependencies
            automated
          assignees: emillassen
